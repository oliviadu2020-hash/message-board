[project]
name = "message-board-workspaces"
version = "0.1.0"
description = "Message Board workspaces CLI (sync.py): read/write/check multi-user messages via git"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.uv]
package = false
