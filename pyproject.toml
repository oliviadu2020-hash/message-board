[project]
name = "message-board"
version = "0.1.0"
description = "Git-based async Agent-to-Agent messaging"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
